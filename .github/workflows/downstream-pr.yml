name: Downstream PR — bump admin_api_key_manager in apps

# Push to master (where 1.6.1 lives) opens a PR in every Dart app that
# depends on this package. Apps then see the update as a normal PR, not a
# silent `pub get` — they can run CI, review changelog, and merge when ready.
#
# Why not pub.dev + Dependabot? This package is consumed via `git:` (not pub.dev),
# so Dependabot has nothing to watch. This workflow is the Dependabot for git deps.
on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      target:
        description: 'Single repo to update (e.g. Keshab1997/quizbaaz) — empty means all'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved $VER from pubspec.yaml"

      - name: Open PRs in downstream apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          # All Dart apps that may depend on admin_api_key_manager.
          # The script is safe for repos that don't depend on it — it just skips them.
          ALL_REPOS=(
            "Keshab1997/smart_ocr_ai_bridge"
            "Keshab1997/image-to-text-flutter"
            "Keshab1997/khoroch-diary"
            "Keshab1997/ReplyMate-AI"
            "Keshab1997/karmopath"
            "Keshab1997/GrammarBondhu"
            "Keshab1997/SpeakEasy"
            "Keshab1997/quizbaaz"
            "Keshab1997/metro-dash"
            "Keshab1997/ink-fight"
            "Keshab1997/spendstory"
            "Keshab1997/app-remover"
          )

          if [ -n "$TARGET" ]; then
            REPOS=("$TARGET")
          else
            REPOS=("${ALL_REPOS[@]}")
          fi

          echo "Downstream version $VERSION → ${REPOS[*]}"

          for REPO in "${REPOS[@]}"; do
            echo "== $REPO =="
            TMP=$(mktemp -d)
            # Clone with token so push works. GH_TOKEN is installation token with contents:write.
            if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$TMP/repo" 2>&1 | tail -2; then
              echo "  skip — cannot clone (private or not found)"
              rm -rf "$TMP"
              continue
            fi
            cd "$TMP/repo"

            # Does this repo actually depend on admin_api_key_manager?
            if ! grep -rq "admin_api_key_manager" pubspec.yaml 2>/dev/null; then
              echo "  skip — no admin_api_key_manager in pubspec.yaml"
              cd - >/dev/null
              rm -rf "$TMP"
              continue
            fi

            # Current ref
            echo "  pubspec before:"
            grep -A2 "admin_api_key_manager" pubspec.yaml | head -5 || true

            # A `git:` dependency is pinned by pubspec.lock's resolved-ref, not
            # by the pubspec — `ref: master` already means "latest". So for
            # these repos editing pubspec.yaml changes nothing and the old
            # script produced an empty diff and skipped them silently, which is
            # why a repo could sit on a months-old build with the phone telling
            # nobody. Rewrite the lock instead.
            IS_GIT_DEP=0
            if grep -A3 "admin_api_key_manager:" pubspec.yaml | grep -q "git:"; then
              IS_GIT_DEP=1
            fi

            if [ "$IS_GIT_DEP" = "1" ] && [ -f pubspec.lock ]; then
              echo "  git dependency — bumping pubspec.lock resolved-ref to $GITHUB_SHA"
              awk -v sha="$GITHUB_SHA" -v ver="$VERSION" '
                /^  admin_api_key_manager:/ { inblk = 1 }
                inblk && /^    version:/ { sub(/version:.*/, "version: \"" ver "\""); print; next }
                inblk && /resolved-ref:/ { sub(/resolved-ref:.*/, "resolved-ref: \"" sha "\""); print; next }
                inblk && /^  [A-Za-z0-9_]/ && !/^  admin_api_key_manager:/ { inblk = 0 }
                { print }
              ' pubspec.lock > pubspec.lock.tmp && mv pubspec.lock.tmp pubspec.lock
              grep -A6 "admin_api_key_manager:" pubspec.lock | head -8 || true
            fi

            BRANCH="chore/bump-admin_api_key_manager-${VERSION}"
            # If branch already exists remote, skip (PR already open for this version)
            if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
              echo "  skip — branch $BRANCH already exists (PR open)"
              cd - >/dev/null
              rm -rf "$TMP"
              continue
            fi

            git checkout -b "$BRANCH"

            # Update pubspec.yaml:
            # - if `git: ... admin_api_key_manager.git` → keep git, but ensure it tracks master (no tag pin)
            # - if `admin_api_key_manager: ^x.y.z` → bump to ^$VERSION
            # - if `admin_api_key_manager: any` → keep any (pub get will resolve)
            # We only touch the version line when it looks like a semver constraint.
            if grep -q "admin_api_key_manager:" pubspec.yaml; then
              # Case 1: version constraint like ^1.5.0 or 1.5.0 or >=1.5.0
              # Replace the first semver after the colon with ^$VERSION
              # Keep git: blocks untouched.
              awk -v ver="^${VERSION}" '
                /admin_api_key_manager:/ && !done {
                  # If next non-empty line is "    git:" then this is a git dep — leave it
                  getline nextline
                  if (nextline ~ /git:/) {
                    print $0
                    print nextline
                    # copy the rest of git block (url, ref) as-is
                    while ((getline l) > 0) {
                      print l
                      if (l ~ /ref:/) break
                    }
                    done=1
                    next
                  } else {
                    # version line — replace constraint
                    sub(/:.*/, ": " ver)
                    print $0
                    print nextline
                    done=1
                    next
                  }
                }
                {print}
              ' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml || true

              # Fallback simple replace for the common `^x.y.z` case if awk missed it
              if grep -q "admin_api_key_manager: \^" pubspec.yaml; then
                sed -i -E "s/(admin_api_key_manager:[[:space:]]*)\^[^[:space:]]+/\1^${VERSION}/" pubspec.yaml
              fi
            fi

            echo "  pubspec after:"
            grep -A2 "admin_api_key_manager" pubspec.yaml | head -5 || true

            # No CHANGELOG edit: a line pushed into the consumer's own changelog
            # is noise that hides the real entries.

            git config user.name "keshab-flutter-assistant"
            git config user.email "Keshab1997@users.noreply.github.com"
            git add pubspec.yaml pubspec.lock 2>/dev/null || git add pubspec.yaml
            if git diff --cached --quiet; then
              echo "  skip — no diff after bump"
              cd - >/dev/null
              rm -rf "$TMP"
              continue
            fi
            git commit -m "chore(deps): bump admin_api_key_manager to $VERSION

            Automated by admin_api_key_manager downstream-pr workflow.
            Source: Keshab1997/admin_api_key_manager@$VERSION"

            git push -u origin "$BRANCH"

            # The default branch, not a hard-coded `master`: quizbaaz is on
            # `main`, so every PR attempt there failed with "base not found".
            BASE=$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name 2>/dev/null || echo "")
            if [ -z "$BASE" ]; then BASE="master"; fi
            echo "  base branch: $BASE"

            # Open PR — if one already exists GitHub returns 422, we treat as skip
            gh pr create \
              --repo "$REPO" \
              --title "chore(deps): bump admin_api_key_manager to $VERSION" \
              --body "Automated bump to **Keshab1997/admin_api_key_manager@$VERSION** ($GITHUB_SHA).

            - What changed: https://github.com/Keshab1997/admin_api_key_manager/blob/master/CHANGELOG.md

            For a \`git:\` dependency this PR touches only \`pubspec.lock\` — that file, not \`ref: master\`, is what \`flutter pub get\` obeys, so an app can otherwise keep building a months-old copy while master moves on.

            Merge when ready — CI will run \`flutter analyze\` / \`flutter test\` in this app.

            _Workflow: \`.github/workflows/downstream-pr.yml\` in admin_api_key_manager_" \
              --base "$BASE" \
              --head "$BRANCH" || echo "  PR already exists or cannot create — check $REPO"

            cd - >/dev/null
            rm -rf "$TMP"
          done

          echo "Done."
