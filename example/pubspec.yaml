publish_to: none
version: 1.0.0

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0 <5.0.0"
  cloud_firestore: ">=5.0.0 <7.0.0"
  hive_flutter: ^1.1.0
  admin_api_key_manager:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
